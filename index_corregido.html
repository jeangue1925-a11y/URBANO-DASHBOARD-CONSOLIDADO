<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbano Envíos · Dashboard de Gestión Comercial</title>
<style>
:root{
  --rojo:#C8102E; --rojo-d:#9B0C22; --negro:#0E1116; --g900:#1A1D21; --g700:#33383F;
  --g500:#5A626B; --g300:#B8BEC5; --g100:#EEF0F2; --g50:#F7F8F9;
  --verde:#12B76A; --ambar:#F59E0B; --azul:#2563EB; --morado:#7C3AED;
  --sombra:0 2px 12px rgba(0,0,0,.07); --sombra-h:0 10px 28px rgba(0,0,0,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--g50);color:var(--negro);padding-bottom:40px}

/* ===== HEADER ===== */
.top{background:linear-gradient(135deg,var(--negro),var(--g900) 60%,var(--rojo-d));color:#fff;padding:18px 28px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:60;box-shadow:var(--sombra-h)}
.top .l{display:flex;align-items:center;gap:14px}
.logo-mark{display:flex;align-items:center;background:#fff;border-radius:11px;padding:7px 14px}
.logo-mark img{height:34px;width:auto;display:block}
.top h1{font-size:17px;font-weight:800}
.top .sub{font-size:11.5px;color:#ddd;margin-top:2px;display:flex;align-items:center;gap:6px}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--verde);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top .per{text-align:right;font-size:11.5px;color:#ddd}
.top .per .upd{font-weight:800;color:#fff}

/* ===== STATUS BAR ===== */
.statusbar{background:#fff;padding:8px 28px;font-size:11.5px;color:var(--g500);display:flex;gap:18px;align-items:center;
  border-bottom:1px solid var(--g100);flex-wrap:wrap}
.statusbar .si{display:flex;align-items:center;gap:6px}
.statusbar .dot{width:8px;height:8px;border-radius:50%}
.dot.ok{background:var(--verde)} .dot.warn{background:var(--ambar)} .dot.err{background:var(--rojo)} .dot.load{background:var(--g300)}
#refreshBtn{margin-left:auto;background:var(--g100);border:none;border-radius:8px;padding:6px 14px;font-size:11.5px;font-weight:700;
  color:var(--g700);cursor:pointer;display:flex;align-items:center;gap:6px}
#refreshBtn:hover{background:var(--g300)}

/* ===== NAV ===== */
.tabs{display:flex;gap:5px;background:#fff;padding:9px 20px;box-shadow:var(--sombra);overflow-x:auto;position:sticky;top:66px;z-index:50}
.tab{border:none;background:transparent;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:700;color:var(--g500);
  cursor:pointer;white-space:nowrap;transition:.2s;display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--g100)}
.tab.active{background:linear-gradient(120deg,var(--rojo),var(--rojo-d));color:#fff;box-shadow:0 4px 10px rgba(200,16,46,.3)}

.wrap{max-width:1240px;margin:0 auto;padding:22px 18px}
.page{display:none}.page.active{display:block;animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== FILTERS ===== */
.filters{background:#fff;border-radius:16px;box-shadow:var(--sombra);padding:16px 20px;margin-bottom:18px;
  display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.5px}
.fg select,.fg input{padding:9px 14px;border:1.5px solid var(--g100);border-radius:10px;font-size:13px;font-weight:600;
  color:var(--negro);background:var(--g50);cursor:pointer;min-width:160px}
.fg select:focus,.fg input:focus{outline:none;border-color:var(--rojo);background:#fff}
.fg.grow{flex:1;min-width:220px}
.fg.grow input{width:100%;min-width:0}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:var(--g100);color:var(--g500);
  border:none;transition:.15s}
.chip.active{background:var(--negro);color:#fff}
.chip.active.mant{background:var(--g700)}
.chip.active.nuevo{background:var(--rojo)}
.chip.active.varios{background:var(--azul)}

/* ===== KPI GRID ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;margin-bottom:20px}
.kpi{background:#fff;border-radius:16px;padding:17px 19px;box-shadow:var(--sombra);border-top:4px solid var(--rojo);
  position:relative;overflow:hidden;transition:.25s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sombra-h)}
.kpi.k{border-top-color:var(--negro)}.kpi.v{border-top-color:var(--verde)}.kpi.a{border-top-color:var(--ambar)}
.kpi.b{border-top-color:var(--azul)}.kpi.m{border-top-color:var(--morado)}
.kpi .lbl{font-size:10.5px;color:var(--g500);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:26px;font-weight:900;margin-top:5px;line-height:1.1}
.kpi .sub{font-size:11px;color:var(--g300);margin-top:4px;font-weight:600}
.kpi .ic{position:absolute;right:14px;top:14px;font-size:26px;opacity:.15}

/* ===== CARDS ===== */
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:var(--sombra);margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h3 .cnt{font-size:11.5px;color:var(--g300);font-weight:600;background:var(--g50);padding:3px 10px;border-radius:20px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

/* ===== CHART: DONUT ===== */
.dn{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.leg{display:flex;flex-direction:column;gap:9px;font-size:13px}
.leg .li{display:flex;align-items:center;gap:9px}
.leg .sw{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.leg b{font-weight:800}
.leg .pct{color:var(--g300);font-size:11px}

/* ===== CHART: BARS ===== */
.bars{display:flex;align-items:flex-end;gap:8px;height:200px;padding:10px 4px 0;overflow-x:auto}
.bcol{flex:1;min-width:36px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bcol .bv{width:100%;border-radius:8px 8px 3px 3px;transition:height .6s cubic-bezier(.34,1.56,.64,1);min-height:3px;
  position:relative;cursor:pointer}
.bcol .bv:hover{filter:brightness(1.1)}
.bcol .lbl2{font-size:9.5px;font-weight:700;color:var(--g500);text-align:center;line-height:1.2;max-width:64px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcol .val2{font-size:10px;font-weight:800;color:var(--negro)}

/* horizontal bars */
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hbar .hl{min-width:130px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .ht{flex:1;height:24px;background:var(--g100);border-radius:7px;overflow:hidden}
.hbar .hf{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;
  color:#fff;font-size:11px;font-weight:800;min-width:34px;transition:width .7s cubic-bezier(.34,1.56,.64,1)}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:10px;color:var(--g500);font-size:10px;text-transform:uppercase;letter-spacing:.3px;
  border-bottom:2px solid var(--g100);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--rojo)}
th .arrow{opacity:.4;font-size:9px;margin-left:3px}
td{padding:10px;border-bottom:1px solid var(--g100)}
tr.rowclick{cursor:pointer;transition:.15s}
tr.rowclick:hover td{background:var(--g50)}
td.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
td.ce{text-align:center}
td.nm{font-weight:700}
td.cod{color:var(--g300);font-size:10.5px;font-weight:700}
td.rk{font-weight:900;color:var(--rojo);text-align:center;width:24px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:800}
.pill.verde{background:#e5f6ee;color:#0b7a48}.pill.rojo{background:#fdeaec;color:var(--rojo-d)}
.pill.ambar{background:#fef3e2;color:#b5710a}.pill.azul{background:#e7ecff;color:#2947b8}.pill.g{background:var(--g100);color:var(--g500)}

/* ===== ACTAS TIMELINE / VISOR ===== */
.acta-card{border:1px solid var(--g100);border-radius:14px;margin-bottom:12px;overflow:hidden;transition:.2s}
.acta-card:hover{box-shadow:var(--sombra)}
.acta-head{padding:14px 18px;background:var(--g50);cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap}
.acta-head .ah-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acta-head .ah-cli{font-weight:800;font-size:14px}
.acta-head .ah-meta{font-size:11px;color:var(--g500)}
.acta-body{padding:0 18px;max-height:0;overflow:hidden;transition:max-height .35s ease}
.acta-body.open{max-height:2000px;padding:6px 18px 18px}
.af-item{padding:10px 0;border-bottom:1px solid var(--g100);font-size:13px;line-height:1.55}
.af-item:last-child{border-bottom:none}
.af-item .af-lbl{font-size:10.5px;font-weight:800;color:var(--rojo-d);text-transform:uppercase;letter-spacing:.3px;
  margin-bottom:4px;display:block}
.af-item .af-txt{color:var(--g700)}
.chev{transition:transform .25s;display:inline-block;color:var(--g300)}
.chev.open{transform:rotate(90deg)}

/* ===== INSIGHTS / ALERTS ===== */
.insight{background:#fff7e6;border-left:4px solid var(--ambar);padding:13px 16px;border-radius:9px;margin-top:12px;font-size:12.5px;line-height:1.5}
.insight.r{background:#fdeaec;border-left-color:var(--rojo)}
.insight.v{background:#e5f6ee;border-left-color:var(--verde)}
.insight.b{background:#e7ecff;border-left-color:var(--azul)}
.insight b{display:block;margin-bottom:3px}

.empty{text-align:center;color:var(--g300);padding:30px;font-size:13px}
.skel{background:linear-gradient(90deg,var(--g100) 25%,var(--g50) 37%,var(--g100) 63%);background-size:400% 100%;
  animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.hidden{display:none !important}

.searchbox{position:relative}
.searchbox::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.5}
.searchbox input{padding-left:34px !important}

/* ===== LINE CHART ===== */
.linechart{overflow-x:auto}
.linechart svg{display:block}
.lc-dot{cursor:pointer}
.lc-dot:hover{r:6}
.lc-tooltip{font-size:10px;font-weight:800;fill:#0E1116}

/* ===== STACKED BARS ===== */
.stackbar{display:flex;align-items:flex-end;gap:10px;height:190px;padding:10px 4px 0;overflow-x:auto}
.stcol{flex:1;min-width:40px;display:flex;flex-direction:column-reverse;height:170px;border-radius:8px 8px 3px 3px;overflow:hidden}
.stcol .seg{width:100%;transition:height .6s cubic-bezier(.34,1.56,.64,1)}
.stlabels{display:flex;gap:10px;padding:0 4px;overflow-x:auto}
.stlabels .stl{flex:1;min-width:40px;text-align:center;font-size:9.5px;font-weight:700;color:#5A626B}

/* ===== GAUGE / progreso circular ===== */
.gauge-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.gauge{position:relative}
.gauge .gval{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.gauge .gval b{font-size:22px;font-weight:900;display:block}
.gauge .gval span{font-size:9px;color:#5A626B;font-weight:700}

.miniStat{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:12.5px}
.miniStat .msDot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.miniStat .msLbl{flex:1;color:#5A626B}
.miniStat .msVal{font-weight:800}

.daterange{display:flex;gap:8px;align-items:center}
.daterange input{padding:8px 10px;border:1.5px solid var(--g100);border-radius:9px;font-size:12px}

.foot{text-align:center;color:var(--g300);font-size:11.5px;padding:26px 20px;line-height:1.7}

/* ===== GADGETS NUEVOS ===== */
.heatmap{display:grid;grid-template-columns:repeat(auto-fill,20px);grid-auto-rows:20px;gap:4px;margin-bottom:10px;justify-content:flex-start}
.hmcell{width:20px;height:20px;border-radius:4px;cursor:default;transition:.15s}
.hmcell:hover{transform:scale(1.25)}
.hmcell.hm0{background:var(--g100)}
.hmcell.hm1{background:#f7c9d1}
.hmcell.hm2{background:#ea8296}
.hmcell.hm3{background:#d43f5c}
.hmcell.hm4{background:var(--rojo)}
.hmleg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--g500);font-weight:700;justify-content:flex-end}
.hmleg .hmcell{width:13px;height:13px;flex:none}

.podio{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-bottom:16px;padding-top:10px}
.podio-item{text-align:center;border-radius:14px;padding:14px 16px;min-width:88px}
.podio-1{background:linear-gradient(180deg,#fff7e0,#fceec2);order:2;padding-top:20px;box-shadow:0 6px 16px rgba(245,158,11,.25)}
.podio-2{background:var(--g50);order:1}
.podio-3{background:#fdeeea;order:3}
.podio-medal{font-size:26px;margin-bottom:4px}
.podio-val{font-size:20px;font-weight:900;color:var(--negro)}
.podio-lbl{font-size:11px;font-weight:700;color:var(--g500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}
.podio-resto{border-top:1px solid var(--g100);padding-top:8px}
.pr-row{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:12.5px}
.pr-pos{width:18px;color:var(--g300);font-weight:800;text-align:center}
.pr-lbl{flex:1;font-weight:600;color:var(--g700)}
.pr-val{font-weight:800;color:var(--negro)}

.trend-card{background:var(--g50);border-radius:12px;padding:14px 16px;flex:1;min-width:140px}
.trend-lbl{font-size:10.5px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.4px}
.trend-row{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.trend-val{font-size:24px;font-weight:900;color:var(--negro)}
.trend-delta{font-size:13px;font-weight:800}
.trend-sub{font-size:10.5px;color:var(--g300);margin-top:2px;font-weight:600}
.trend-row-wrap{display:flex;gap:12px;flex-wrap:wrap}

.foot a{color:var(--rojo);text-decoration:none;font-weight:700}

.errbox{background:#fdeaec;border:1.5px dashed var(--rojo);border-radius:14px;padding:20px;text-align:center;color:var(--rojo-d);font-size:13px}
</style>
</head>
